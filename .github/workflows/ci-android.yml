name: Personal Android APK
on:
  push:
    branches: [codex/librepods-v2-personal]
    paths: ['android/**', 'scripts/**', '.github/workflows/ci-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'cmake;3.22.1' 'ndk;30.0.14904198'
      - name: Configure personal signing
        env:
          PERSONAL_KEYSTORE_BASE64: ${{ secrets.PERSONAL_KEYSTORE_BASE64 }}
          PERSONAL_KEYSTORE_PASSWORD: ${{ secrets.PERSONAL_KEYSTORE_PASSWORD }}
        shell: python
        run: |
          import base64, os, pathlib
          password = os.environ['PERSONAL_KEYSTORE_PASSWORD']
          encoded = os.environ['PERSONAL_KEYSTORE_BASE64']
          if not password or not encoded:
              raise SystemExit('Set PERSONAL_KEYSTORE_BASE64 and PERSONAL_KEYSTORE_PASSWORD secrets first.')
          key = pathlib.Path(os.environ['RUNNER_TEMP']) / 'librepods-personal.p12'
          key.write_bytes(base64.b64decode(encoded, validate=True))
          key.chmod(0o600)
          props = pathlib.Path('android/local.properties')
          props.write_text(f'RELEASE_STORE_FILE={key}\nRELEASE_STORE_PASSWORD={password}\nRELEASE_KEY_ALIAS=librepods-personal\nRELEASE_KEY_PASSWORD={password}\n')
          props.chmod(0o600)
      - name: Test and build signed personal APK
        run: ./scripts/build-personal.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LibrePods-Personal-${{ github.sha }}
          path: |
            dist/*.apk
            dist/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-test-results
          path: |
            android/core/build/reports/tests/
            android/core/build/test-results/
            android/app/build/reports/tests/
            android/app/build/test-results/
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/librepods-personal.p12" android/local.properties
